name: Feature request
description: Something Cinomni should do that it does not do today.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check ROADMAP.md first: it lists what is planned and what is deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
